<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>万神殿 Pantheon · 罗马 1:1 全景</title>
<meta name="description" content="1:1 程序化 Three.js 重建的罗马万神殿：科林斯柱廊、43.3 米穹顶、眼窗光柱、帕拉佐·罗通达广场与周围的永恒之城，含昼夜、天气与漫游动画。">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 13h28L16 4z M5 14h3v11H5z M10 14h3v11h-3z M15 14h3v11h-3z M20 14h3v11h-3z M25 14h3v11h-3z M2 26h28v3H2z' fill='%23e0b866'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg:#0b0a09; --fg:#f4ecdc; --dim:#b9ad96; --acc:#e6bd6a; --acc2:#f3d79b; --glass:rgba(20,16,12,.58); --line:rgba(255,236,200,.14); --r:14px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.45 -apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif; overflow:hidden; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; cursor:grab; }
  canvas#gl:active { cursor:grabbing; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; background:transparent; border:0; padding:0; }

  /* ---------------- loading */
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:radial-gradient(ellipse at 50% 40%,#1d1710 0%,#0b0a09 70%); transition:opacity .9s ease, visibility .9s; }
  #loading.done { opacity:0; visibility:hidden; }
  #loading .ring { width:92px; height:92px; border-radius:50%; border:2px solid rgba(230,189,106,.25); border-top-color:var(--acc); animation:spin 1.6s linear infinite; position:relative; }
  #loading .ring::after { content:""; position:absolute; inset:18px; border-radius:50%; background:radial-gradient(circle,#fff6dc 0%,rgba(255,225,160,.7) 40%,rgba(230,189,106,0) 70%); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes spin { to { transform:rotate(360deg); } } @keyframes pulse { 50% { opacity:.45; transform:scale(.8); } }
  #loading h1 { margin:6px 0 0; font:300 30px/1.1 "Cormorant Garamond","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC",serif; letter-spacing:.35em; padding-left:.35em; }
  #loading p { margin:0; color:var(--dim); letter-spacing:.08em; min-height:1.4em; }
  #loading .bar { width:min(320px,70vw); height:2px; background:rgba(255,255,255,.1); overflow:hidden; border-radius:2px; }
  #loading .bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .3s ease; }

  /* ---------------- title */
  #title { position:fixed; left:max(18px,env(safe-area-inset-left)); top:max(16px,env(safe-area-inset-top)); z-index:5; pointer-events:none; text-shadow:0 1px 14px rgba(0,0,0,.6); transition:opacity .6s; }
  #title .t1 { font:300 26px/1.1 "Cormorant Garamond","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC",serif; letter-spacing:.14em; }
  #title .t1 b { font-weight:600; color:var(--acc2); }
  #title .t2 { margin-top:4px; color:var(--dim); font-size:12px; letter-spacing:.06em; }
  #caption { position:fixed; left:50%; top:calc(14vh); transform:translateX(-50%); z-index:5; text-align:center; pointer-events:none; opacity:0; transition:opacity 1.2s; text-shadow:0 2px 18px rgba(0,0,0,.75); max-width:80vw; }
  #caption.on { opacity:1; }
  #caption .c1 { font:300 28px/1.2 "Cormorant Garamond","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC",serif; letter-spacing:.18em; }
  #caption .c2 { margin-top:6px; color:var(--acc2); font-size:13px; letter-spacing:.12em; }

  /* ---------------- HUD */
  .glass { background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 10px 40px rgba(0,0,0,.35); }
  #hud { position:fixed; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:6; padding:10px 12px; display:flex; flex-direction:column; gap:8px; width:min(920px,calc(100vw - 20px)); transition:opacity .4s, transform .4s; }
  body.immersive #hud, body.immersive #tools { opacity:0; pointer-events:none; transform:translateX(-50%) translateY(20px); }
  body.immersive #tools { transform:none; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:rgba(0,0,0,.18); }
  .seg button { padding:7px 12px; color:var(--dim); white-space:nowrap; transition:background .2s,color .2s; position:relative; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button:hover { color:var(--fg); background:rgba(255,236,200,.07); }
  .seg button.on { color:#1a1208; background:linear-gradient(180deg,var(--acc2),var(--acc)); font-weight:600; }
  .seg button small { display:block; font-size:9.5px; opacity:.65; letter-spacing:.06em; line-height:1.1; }
  .time { display:flex; align-items:center; gap:10px; flex:1 1 320px; min-width:240px; }
  .time button { width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; color:var(--acc2); flex:none; }
  .time button:hover { background:rgba(255,236,200,.1); }
  #clock { font-variant-numeric:tabular-nums; min-width:46px; text-align:right; color:var(--acc2); font-weight:600; letter-spacing:.04em; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:22px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:linear-gradient(90deg,#0f1a33 0%,#f0a35e 22%,#9fd0ff 35%,#bfe0ff 50%,#9fd0ff 65%,#f0a35e 78%,#0f1a33 100%); }
  input[type=range]::-moz-range-track { height:4px; border-radius:4px; background:linear-gradient(90deg,#0f1a33 0%,#f0a35e 22%,#9fd0ff 35%,#bfe0ff 50%,#9fd0ff 65%,#f0a35e 78%,#0f1a33 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff6dc; border:2px solid var(--acc); margin-top:-6px; box-shadow:0 0 12px rgba(255,220,150,.8); }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#fff6dc; border:2px solid var(--acc); }
  select { background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:7px 10px; outline:none; }
  select option { background:#1a1510; }
  #solar { color:var(--dim); font-size:11.5px; text-align:center; letter-spacing:.03em; }
  #solar b { color:var(--fg); font-weight:600; }

  #tools { position:fixed; right:max(14px,env(safe-area-inset-right)); top:max(14px,env(safe-area-inset-top)); z-index:7; display:flex; flex-direction:column; gap:8px; transition:opacity .4s; }
  #tools button { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:var(--fg); font-size:17px; }
  #tools button:hover { background:rgba(255,236,200,.12); }
  #tools button.on { color:var(--acc2); border-color:var(--acc); }
  #tools svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

  #info { position:fixed; right:max(64px,calc(env(safe-area-inset-right) + 58px)); top:max(14px,env(safe-area-inset-top)); z-index:7; width:min(340px,calc(100vw - 90px)); max-height:calc(100vh - 150px); overflow:auto; padding:16px 18px; opacity:0; visibility:hidden; transform:translateX(10px); transition:all .3s; }
  #info.on { opacity:1; visibility:visible; transform:none; }
  #info h3 { margin:0 0 8px; font:600 12px/1 system-ui; letter-spacing:.2em; color:var(--acc2); text-transform:uppercase; }
  #info dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; }
  #info dt { color:var(--dim); } #info dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  #info hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  #info p { margin:0; color:var(--dim); font-size:12px; }

  #hint { position:fixed; left:50%; bottom:calc(max(14px,env(safe-area-inset-bottom)) + 136px); transform:translateX(-50%); z-index:4; color:rgba(255,246,225,.75); font-size:12px; letter-spacing:.06em; text-shadow:0 1px 10px #000; pointer-events:none; transition:opacity 1s; white-space:nowrap; }
  #toast { position:fixed; left:50%; top:20px; transform:translate(-50%,-30px); z-index:60; padding:9px 16px; border-radius:999px; opacity:0; transition:all .35s; pointer-events:none; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:20; transition:opacity .9s; }
  #fade.on { opacity:1; }
  #stick { position:fixed; left:26px; bottom:150px; width:110px; height:110px; border-radius:50%; z-index:8; display:none; touch-action:none; background:rgba(255,255,255,.06); border:1px solid var(--line); }
  #stick i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(255,236,200,.35); }
  body.touch.walk #stick { display:block; }

  @media (max-width:720px) {
    #title .t1 { font-size:20px; } #title .t2 { display:none; }
    .seg button { padding:6px 9px; font-size:12px; } .seg button small { display:none; }
    #hud { padding:8px; gap:6px; } #hint { display:none; }
    #views { max-width:100%; overflow-x:auto; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="万神殿三维场景"></canvas>

<div id="loading"><div class="ring"></div><h1>PANTHEON</h1><p id="loadmsg">正在铺设永恒之城…</p><div class="bar"><i id="loadbar"></i></div></div>

<header id="title">
  <div class="t1">万神殿 <b>PANTHEON</b></div>
  <div class="t2">罗马 · 公元 118–128 年 · 1 : 1 程序化实时重建</div>
</header>
<div id="caption"><div class="c1" id="cap1"></div><div class="c2" id="cap2"></div></div>

<aside id="tools" class="glass" style="padding:6px">
  <button id="bInfo" title="数据 / Info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
  <button id="bShot" title="截图 / Screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
  <button id="bPano" title="导出 360° 全景图 / Panorama"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></button>
  <button id="bSound" title="声音 / Sound"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4z"/><path d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/></svg></button>
  <button id="bUI" title="沉浸模式 / Hide UI (H)"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button id="bFull" title="全屏 / Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</aside>

<section id="info" class="glass"></section>
<div id="hint">拖动 旋转 · 滚轮 缩放 · 步行模式 WASD / 方向键 · Shift 奔跑 · H 隐藏界面</div>
<div id="stick"><i></i></div>

<nav id="hud" class="glass">
  <div class="row">
    <div class="seg" id="modes">
      <button data-mode="tour">▶ 漫游<small>Tour</small></button>
      <button data-mode="orbit">环绕<small>Orbit</small></button>
      <button data-mode="walk">步行<small>Walk</small></button>
    </div>
    <div class="seg" id="views"></div>
  </div>
  <div class="row">
    <div class="time">
      <button id="play" title="时间流逝">▶</button>
      <input id="hour" type="range" min="0" max="24" step="0.01" value="12" aria-label="太阳时">
      <output id="clock">12:00</output>
    </div>
    <select id="date" aria-label="日期"></select>
    <div class="seg" id="weather">
      <button data-w="clear">晴</button><button data-w="cloudy">多云</button><button data-w="overcast">阴</button><button data-w="rain">雨</button>
    </div>
  </div>
  <div id="solar"></div>
</nav>
<div id="toast" class="glass"></div>
<div id="fade"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
