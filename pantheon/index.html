<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>万神殿 Pantheon</title>
<meta name="description" content="1:1 程序化重建的罗马万神殿与帕拉佐·罗通达广场：拖动环顾，点击地面走近。">
<meta name="theme-color" content="#111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 13h28L16 4z M5 14h3v11H5z M10 14h3v11h-3z M15 14h3v11h-3z M20 14h3v11h-3z M25 14h3v11h-3z M2 26h28v3H2z' fill='%23c9c2b4'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --fg:#ece8df; --dim:#aaa598; --bg:rgba(18,17,15,.62); --line:rgba(255,255,255,.14); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#111; color:var(--fg); font:13px/1.45 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; cursor:grab; }
  canvas#gl.walking { cursor:crosshair; } canvas#gl:active { cursor:grabbing; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:0; padding:0; }

  #status { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:#111; color:var(--dim); transition:opacity .6s, visibility .6s; }
  #status.done { opacity:0; visibility:hidden; }
  #status .bar { width:200px; height:2px; background:rgba(255,255,255,.12); } #status .bar i { display:block; height:100%; width:0; background:#bdb6a6; transition:width .25s; }

  #brand { position:fixed; left:14px; top:12px; z-index:5; color:rgba(255,255,255,.82); font-size:13px; letter-spacing:.04em; text-shadow:0 1px 6px rgba(0,0,0,.6); pointer-events:none; }
  #hint { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:5; padding:6px 12px; border-radius:6px; background:var(--bg); color:var(--fg); opacity:0; transition:opacity .5s; pointer-events:none; white-space:nowrap; }
  #hint.on { opacity:1; }

  .chip { background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  #timebar { position:fixed; left:12px; bottom:12px; z-index:6; display:flex; align-items:center; gap:10px; padding:6px 10px; width:min(340px,calc(100vw - 150px)); }
  #timebar button { width:22px; height:22px; color:var(--fg); }
  #timebar input { flex:1; min-width:0; }
  #clock { font-variant-numeric:tabular-nums; min-width:40px; text-align:right; color:var(--fg); }
  input[type=range] { -webkit-appearance:none; appearance:none; height:20px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:2px; background:rgba(255,255,255,.35); }
  input[type=range]::-moz-range-track { height:2px; background:rgba(255,255,255,.35); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#ece8df; margin-top:-5px; }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border:0; border-radius:50%; background:#ece8df; }

  #menu { position:fixed; right:12px; top:10px; z-index:7; display:flex; gap:6px; align-items:flex-start; }
  #menu > button { padding:5px 10px; }
  #menu > button:hover, #menu > button.on { background:rgba(255,255,255,.12); }
  #pop { position:fixed; right:12px; top:46px; z-index:7; width:min(260px,calc(100vw - 24px)); padding:12px 14px; display:none; flex-direction:column; gap:12px; }
  #pop.on { display:flex; }
  #pop h4 { margin:0 0 6px; font-weight:500; color:var(--dim); font-size:12px; }
  #pop .row { display:flex; flex-wrap:wrap; gap:6px; }
  #pop .row button { padding:4px 9px; border:1px solid var(--line); border-radius:5px; }
  #pop .row button:hover { background:rgba(255,255,255,.1); } #pop .row button.on { background:rgba(255,255,255,.2); }
  #pop select { width:100%; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:5px; padding:5px 8px; }
  #pop select option { background:#1c1b18; }
  #pop .foot { color:var(--dim); font-size:11.5px; line-height:1.5; }

  #toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:40; padding:6px 12px; border-radius:6px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.on { opacity:1; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:20; transition:opacity .5s; } #fade.on { opacity:1; }
  #stick { position:fixed; left:22px; bottom:70px; width:96px; height:96px; border-radius:50%; z-index:8; display:none; touch-action:none; border:1px solid var(--line); }
  #stick i { position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; background:rgba(255,255,255,.25); }
  body.touch #stick { display:block; }
  @media (max-width:560px) { #brand { display:none; } #hint { bottom:58px; white-space:normal; width:calc(100vw - 24px); text-align:center; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl" class="walking" tabindex="0" aria-label="万神殿三维场景"></canvas>

<div id="status"><div id="loadmsg">加载中…</div><div class="bar"><i id="loadbar"></i></div></div>
<div id="brand">万神殿 · Pantheon</div>
<div id="hint"></div>

<div id="timebar" class="chip">
  <button id="play" title="让时间流动" aria-label="播放时间">▶</button>
  <input id="hour" type="range" min="0" max="24" step="0.01" value="17.3" aria-label="一天中的时间">
  <span id="clock">17:18</span>
</div>

<div id="menu">
  <button id="bBird" class="chip" title="从空中俯瞰">鸟瞰</button>
  <button id="bMore" class="chip" title="更多">设置</button>
</div>
<div id="pop" class="chip">
  <div><h4>去哪里</h4><div class="row" id="spots"></div></div>
  <div><h4>日期</h4><select id="date" aria-label="日期"></select></div>
  <div><h4>天气</h4><div class="row" id="weather"><button data-w="clear">晴</button><button data-w="cloudy">多云</button><button data-w="overcast">阴</button><button data-w="rain">雨</button></div></div>
  <div><h4>画质</h4><select id="qsel"><option value="low">低</option><option value="med">中</option><option value="high">高</option></select></div>
  <div class="row"><button id="bSound">声音</button><button id="bShot">截图</button><button id="bPano">360° 全景图</button></div>
  <div class="foot" id="live"></div>
</div>
<div id="toast" class="chip"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
